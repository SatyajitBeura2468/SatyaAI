(function () {
  var shouldShowIntro = true;
  try {
    var saved = localStorage.getItem("satya-preferences-v1");
    var preferences = saved ? JSON.parse(saved) : null;
    shouldShowIntro =
      !window.matchMedia("(prefers-reduced-motion: reduce)").matches &&
      !(preferences && preferences.reduceMotion === true) &&
      !sessionStorage.getItem("satya-intro-seen");
  } catch (_) {
    shouldShowIntro = true;
  }
  if (shouldShowIntro) {
    document.documentElement.classList.add("satya-intro-pending");
    window.setTimeout(function () {
      document.documentElement.classList.remove("satya-intro-pending");
    }, 15000);
  }
})();
</script>
